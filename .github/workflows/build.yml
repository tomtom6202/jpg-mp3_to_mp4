name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Initialize Flutter Project
        run: |
          # 加上 --project-name 強制命名，解決資料夾名稱有橫線的報錯！
          flutter create --project-name my_app .
          flutter pub get

      - name: Fix Android Settings
        run: |
          # 雙重防護：不管是舊版還是最新版的 Android 設定檔，通通幫你改好！
          if [ -f android/app/build.gradle ]; then
            sed -i 's/flutter.minSdkVersion/24/g' android/app/build.gradle
            sed -i '/android {/a \    ndkVersion = "27.0.12077973"' android/app/build.gradle
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/flutter.minSdkVersion/24/g' android/app/build.gradle.kts
            sed -i '/android {/a \    ndkVersion = "27.0.12077973"' android/app/build.gradle.kts
          fi

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Video-App-APK
          path: build/app/outputs/flutter-apk/app-release.apk
