name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Clean Project
        run: |
          flutter create clean_app
          cp pubspec.yaml clean_app/
          cp lib/main.dart clean_app/lib/

      - name: Fix Android Settings & Build
        run: |
          cd clean_app
          flutter pub add shared_preferences
          
          # 更換 App 名稱為你專屬的名稱
          sed -i 's/android:label="[^"]*"/android:label="召會信息編輯"/g' android/app/src/main/AndroidManifest.xml
          
          # 確保主 App 使用 SDK 36
          if [ -f android/app/build.gradle ]; then
            sed -i 's/flutter.compileSdkVersion/36/g' android/app/build.gradle
            sed -i 's/flutter.targetSdkVersion/36/g' android/app/build.gradle
            sed -i 's/flutter.minSdkVersion/24/g' android/app/build.gradle
            sed -i '/android {/a \    ndkVersion = "27.0.12077973"' android/app/build.gradle
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/flutter.compileSdkVersion/36/g' android/app/build.gradle.kts
            sed -i 's/flutter.targetSdkVersion/36/g' android/app/build.gradle.kts
            sed -i 's/flutter.minSdkVersion/24/g' android/app/build.gradle.kts
            sed -i '/android {/a \    ndkVersion = "27.0.12077973"' android/app/build.gradle.kts
          fi
          
          flutter pub get
          
          # 💡 雷射精準打擊：直接去雲端快取資料夾，把 file_picker 等頑固套件裡的 "34" 準確改成 "36"！
          find ~/.pub-cache/hosted/pub.dev/ -name "build.gradle" -exec sed -i 's/compileSdkVersion 34/compileSdkVersion 36/g' {} +
          find ~/.pub-cache/hosted/pub.dev/ -name "build.gradle" -exec sed -i 's/compileSdk 34/compileSdk 36/g' {} +
          find ~/.pub-cache/hosted/pub.dev/ -name "build.gradle" -exec sed -i 's/compileSdk = 34/compileSdk = 36/g' {} +
          
          # 關閉 AGP 9+ 的語法衝突
          echo "android.newDsl=false" >> android/gradle.properties
          
          # 使用 release 模式產出最終版 APK
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Video-App-APK
          path: clean_app/build/app/outputs/flutter-apk/app-release.apk
