name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Clean Project
        run: |
          flutter create clean_app
          cp pubspec.yaml clean_app/
          cp lib/main.dart clean_app/lib/

      - name: Fix Android Settings & Build
        run: |
          cd clean_app
          if [ -f android/app/build.gradle ]; then
            sed -i 's/flutter.minSdkVersion/24/g' android/app/build.gradle
            sed -i '/android {/a \    ndkVersion = "27.0.12077973"' android/app/build.gradle
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/flutter.minSdkVersion/24/g' android/app/build.gradle.kts
            sed -i '/android {/a \    ndkVersion = "27.0.12077973"' android/app/build.gradle.kts
          fi
          flutter pub get
          # 💡 絕招 4：使用 --split-per-abi 切割架構，只產出精簡版 APK！
          flutter build apk --release --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Video-App-APK
          # 💡 絕招 5：只抓取體積最小的 arm64 現代手機專用版！
          path: clean_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
