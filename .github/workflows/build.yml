name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Clean Project
        run: |
          flutter create clean_app
          cp pubspec.yaml clean_app/
          cp lib/main.dart clean_app/lib/

      - name: Fix Android Settings & Build
        run: |
          cd clean_app
          flutter pub add shared_preferences
          
          # 換上你的專屬招牌名稱
          sed -i 's/android:label="[^"]*"/android:label="召會信息編輯"/g' android/app/src/main/AndroidManifest.xml
          
          # 升級 App 本身的編譯 SDK 到 36
          if [ -f android/app/build.gradle ]; then
            sed -i 's/flutter.compileSdkVersion/36/g' android/app/build.gradle
            sed -i 's/flutter.targetSdkVersion/36/g' android/app/build.gradle
            sed -i 's/flutter.minSdkVersion/24/g' android/app/build.gradle
            sed -i '/android {/a \    ndkVersion = "27.0.12077973"' android/app/build.gradle
          fi
          
          # 💡 終極暴力解法：強制把所有外掛套件 (包含固執的 file_picker) 全部綁架到 API 36！
          cat <<EOF >> android/build.gradle
          
          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 36
                      }
                  }
              }
          }
          EOF
          
          flutter pub get
          flutter build apk --debug --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Video-App-APK
          path: clean_app/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
